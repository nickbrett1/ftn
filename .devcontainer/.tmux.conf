# Canonical tmux configuration — used by this project and generated by genproj.
# Installed to ~/.tmux.conf by .devcontainer/post-create-setup.sh.

# Correct terminal type for apps running inside tmux. Fixes TUI rendering
# issues (e.g. goose banner misalignment) on mobile SSH clients like Blink.
set -g default-terminal "tmux-256color"

# Enable truecolor when the outer terminal reports xterm-256color
set -ga terminal-overrides ',xterm-256color:RGB'

# Use Zsh as the shell inside tmux panes
set -g default-shell /bin/zsh

# Mouse support (scroll, select, resize panes)
set -g mouse on

# Faster prefix response (0 ms escape delay)
set -g escape-time 0

# 1-based window and pane numbering; renumber when windows close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Larger scrollback
set -g history-limit 10000

# vi-style keys in copy/status modes
set -g status-keys vi
setw -g mode-keys vi

# Keep VS Code / remote environment variables current when attaching
set -ga update-environment " VSCODE_GIT_IPC_HANDLE VSCODE_GIT_ASKPASS_NODE GIT_ASKPASS VSCODE_GIT_ASKPASS_EXTRA_ARGS VSCODE_GIT_ASKPASS_MAIN VSCODE_IPC_HOOK_CLI REMOTE_CONTAINERS_IPC SSH_AUTH_SOCK LANG LC_ALL LC_CTYPE"

# Show the project name in the bottom-right status bar
set -g status-right "ftn"
