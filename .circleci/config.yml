version: 2.1

# SETUP / dynamic config. This always runs a cheap path-filtering job that
# inspects which files changed and injects pipeline parameters into the real
# pipeline (.circleci/config-main.yml), so the heavy build/test/deploy pipeline
# is skipped for docs/specs/markdown/CI-only changes.
#
# Parameters injected:
#   run-build-test-deploy (default true in config-main.yml) - set false for
#     trivial changes so the whole pipeline is skipped.
#   run-lighthouse (default false) - set true only for landing-page changes so
#     Lighthouse runs on main.
#
# The `webapp/.*` -> true lines are deliberately ordered AFTER the trivial
# `false` lines so a commit touching both webapp code and docs still runs the
# pipeline (last matching line wins for a parameter).

setup: true

orbs:
  path-filtering: circleci/path-filtering@1.0.0

workflows:
  path-filtering-workflow:
    jobs:
      - path-filtering/filter:
          config-path: .circleci/config-main.yml
          mapping: |
            docs/.* run-build-test-deploy false
            specs/.* run-build-test-deploy false
            .*\.md run-build-test-deploy false
            .circleci/.* run-build-test-deploy false
            webapp/.* run-build-test-deploy true
            package.json run-build-test-deploy true
            package-lock.json run-build-test-deploy true
            webapp/src/routes/\+page\.svelte run-lighthouse true
            webapp/src/routes/\+layout\.svelte run-lighthouse true
            webapp/src/routes/\+error\.svelte run-lighthouse true
            webapp/src/lib/components/(About|Contact|Experience|Footer|Header|Landing|Navbar|Projects)\.svelte run-lighthouse true
            webapp/src/app\.css run-lighthouse true
            webapp/static/.* run-lighthouse true
            webapp/src/lib/icons/.* run-lighthouse true
            webapp/src/lib/images/.* run-lighthouse true
