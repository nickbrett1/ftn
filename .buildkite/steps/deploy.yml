# Deploy steps — ported from CircleCI's `deploy` / `deploy-preview` jobs.
#
# Uploaded by .buildkite/bootstrap.sh according to BUILDKITE_DEPLOY_MODE
# (off | preview | all). The pilot kept these off (D6); once CircleCI was retired
# this became the only path to production, so preview is enabled first.
#
# Divergences from CircleCI, all forced by the platform move:
#   * the `build` workspace (persist_to_workspace / attach_workspace) is the
#     artifacts API — the build output is downloaded before the command hooks;
#   * `context: common` has no Buildkite equivalent, so the Cloudflare
#     credentials are resolved from Doppler at runtime by
#     scripts/export-cloudflare-env.sh (sourced, so the exports persist);
#   * one pinned image for every step instead of cimg/node, so there is a single
#     digest to maintain.

steps:
  - label: ":rocket: Deploy (production)"
    key: deploy
    agents: &agent-queue
      queue: mac-studio-linux
    depends_on:
      - code_test
    if: build.branch == "main"
    plugins:
      - artifacts#v1.9.4:
          download:
            - "webapp/.svelte-kit/**"
            - "webapp/static/pdf.worker.min.mjs"
      - docker#v5.13.0:
          image: "mcr.microsoft.com/playwright:v1.63.0-jammy@sha256:167d0506cfbe3c294fb214b2d11737326eeee028aa611fa1ba538e5057675847"
          workdir: /workdir
          environment:
            - DOPPLER_TOKEN
            - DOPPLER_PROJECT
            - DOPPLER_ENVIRONMENT
    env:
      DOPPLER_PROJECT: webapp
      DOPPLER_ENVIRONMENT: stg
      SENTRY_ORG: nick-brett
      SENTRY_PROJECT: bem-backend
      SENTRY_ENVIRONMENT: production
    commands:
      - bash .buildkite/scripts/install-doppler-cli.sh
      - . .buildkite/scripts/export-cloudflare-env.sh prd
      - (cd webapp && ./scripts/setup-wrangler-config.sh stg)
      - apt-get update && apt-get install -y --no-install-recommends jq
      - (cd webapp && npm ci)
      - chmod +x ./webapp/scripts/sync-doppler-secrets.sh
      - ./webapp/scripts/sync-doppler-secrets.sh --project webapp --config prd --env production
      - (cd webapp && npm run deploy)
      # ntfy notification (Doppler-provided URL), same as CircleCI's notify_deployment.
      #
      # `$$` here is deliberate: Buildkite interpolates `$VAR` in YAML `command:`
      # blocks and an unknown var becomes EMPTY, so a shell reference to a hook var
      # must be written `$$VAR` to survive to the shell.
      - |
        NTFY_URL="$$(doppler secrets get NTFY_URL_CIRCLECI_BUILD --plain --project common --config prd --token "$$DOPPLER_TOKEN" | jq -r .computed 2>/dev/null || true)"
        if [ -n "$$NTFY_URL" ] && [ "$$NTFY_URL" != "null" ]; then
          curl -s -d "🚀 [ftn] Production deployment successful! Branch: $${BUILDKITE_BRANCH}, Commit: $${BUILDKITE_COMMIT:0:7}" "$$NTFY_URL"
        else
          echo "⚠️ NTFY_URL_CIRCLECI_BUILD not found — skipping notification."
        fi

  - label: ":rocket: Deploy preview"
    key: deploy_preview
    agents: *agent-queue
    depends_on:
      - code_test
    # CircleCI: branches ignore main and dependabot/**.
    if: build.branch != "main" && build.branch !~ /^dependabot\//
    plugins:
      - artifacts#v1.9.4:
          download:
            - "webapp/.svelte-kit/**"
            - "webapp/static/pdf.worker.min.mjs"
      - docker#v5.13.0:
          image: "mcr.microsoft.com/playwright:v1.63.0-jammy@sha256:167d0506cfbe3c294fb214b2d11737326eeee028aa611fa1ba538e5057675847"
          workdir: /workdir
          environment:
            - DOPPLER_TOKEN
            - DOPPLER_PROJECT
            - DOPPLER_ENVIRONMENT
    env:
      DOPPLER_PROJECT: webapp
      DOPPLER_ENVIRONMENT: stg
      SENTRY_ORG: nick-brett
      SENTRY_PROJECT: bem-backend
      SENTRY_ENVIRONMENT: preview
    commands:
      - bash .buildkite/scripts/install-doppler-cli.sh
      - . .buildkite/scripts/export-cloudflare-env.sh stg
      - (cd webapp && ./scripts/setup-wrangler-config.sh stg)
      - apt-get update && apt-get install -y --no-install-recommends jq
      - (cd webapp && npm ci)
      - chmod +x ./webapp/scripts/sync-doppler-secrets.sh
      - ./webapp/scripts/sync-doppler-secrets.sh --project webapp --config stg --env preview
      - (cd webapp && npm run deploy-preview)
