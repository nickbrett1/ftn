# Heavy step set — uploaded by .buildkite/bootstrap.sh when the diff is not
# trivial (the port of CircleCI's `build_test_deploy` workflow).

# Pinned by DIGEST (S1 / §3.1). The floating `:jammy` tag is stale (Node 20.16,
# Playwright 1.47) and CANNOT build this vite 7 app; the `v1.63.0-jammy` tag is
# what Phase 0 verified (Node 24.20.0, npm 11.19.0, chromium-1243, arm64).
# `webapp`'s playwright resolves to 1.63.0, matching the baked browser, so no
# browser download is needed.
#   mcr.microsoft.com/playwright:v1.63.0-jammy@sha256:167d0506cfbe3c294fb214b2d11737326eeee028aa611fa1ba538e5057675847

# NOTE on `environment:` lists — they are NAME-ONLY, deliberately:
#   * the value resolves from the JOB env at container start (`docker run --env NAME`);
#   * v4's BUILDKITE_ENV_FILE omits environment-hook vars, so
#     `propagate-environment: true` forwards nothing useful (proved in Phase 0.5);
#   * an inline `NAME=value` would leak the secret into the uploaded YAML and
#     hard-fail `pipeline upload` on v4's secret scanner.
# DOPPLER_TOKEN is delivered to the job env by the agent `environment` hook (D10)
# and named `*_TOKEN` so the agent's default log redaction applies for free.
#
# DOPPLER_PROJECT / DOPPLER_ENVIRONMENT are also listed here — learned in build
# #6: a step-level `env:` value does NOT reach the container on its own, only
# entries in this list do. Without it `doppler run` fails with
# "You must specify a project" and wrangler.jsonc is never generated.

steps:
  - label: ":shield: ggshield secret scan"
    key: ggshield
    agents: &agent-queue
      queue: mac-studio-linux
    env:
      SCAN_BASE: "__BASE_REVISION__"
    command: bash .buildkite/scripts/ggshield-scan.sh

  - label: ":hammer: Build"
    key: build
    agents: *agent-queue
    # Deliberately NO concurrency_group here.
    #
    # The named npm-cache volume IS shared, but a group never actually protected
    # it: within a single build, `code_test` and the Lighthouse step already run
    # concurrently against that same volume (npm's cache is content-addressed
    # and safe for concurrent writers). All the group did was serialise Build
    # steps across *different* builds — and, combined with a dependent step in
    # the same group, it deadlocked build #23 (Buildkite takes the group slot
    # when a step is created, before its dependencies are satisfied).
    #
    # The two agents (spawn=2) are therefore free to run builds concurrently.
    plugins:
      - docker#v5.13.0:
          image: "mcr.microsoft.com/playwright:v1.63.0-jammy@sha256:167d0506cfbe3c294fb214b2d11737326eeee028aa611fa1ba538e5057675847"
          workdir: /workdir
          environment:
            - DOPPLER_TOKEN
            - DOPPLER_PROJECT
            - DOPPLER_ENVIRONMENT
          volumes:
            - "ftn-npm-cache:/root/.npm"
    env:
      DOPPLER_PROJECT: webapp
      DOPPLER_ENVIRONMENT: stg
    # NOTE: unlike CircleCI's `run:` steps, the docker plugin runs all of these
    # in ONE shell, so a bare `cd webapp` would persist. Subshells keep each
    # command's working directory isolated.
    commands:
      - bash .buildkite/scripts/install-doppler-cli.sh
      - (cd webapp && ./scripts/setup-wrangler-config.sh stg)
      - bash .buildkite/scripts/assert-wrangler-jsonc.sh
      - (cd webapp && npm ci)
      - bash .buildkite/scripts/lockfile-drift-check.sh
      - (cd webapp && npm run build)
    artifact_paths:
      - "webapp/.svelte-kit/**"
      - "webapp/static/pdf.worker.min.mjs"

  - label: ":test_tube: Code test"
    key: code_test
    agents: *agent-queue
    depends_on:
      - build
    plugins:
      - docker#v5.13.0:
          image: "mcr.microsoft.com/playwright:v1.63.0-jammy@sha256:167d0506cfbe3c294fb214b2d11737326eeee028aa611fa1ba538e5057675847"
          workdir: /workdir
          environment:
            - DOPPLER_TOKEN
            - DOPPLER_PROJECT
            - DOPPLER_ENVIRONMENT
          volumes:
            - "ftn-npm-cache:/root/.npm"
    env:
      DOPPLER_PROJECT: webapp
      DOPPLER_ENVIRONMENT: stg
    commands:
      - bash .buildkite/scripts/install-doppler-cli.sh
      - (cd webapp && npm ci)
      - (cd webapp && ./scripts/setup-wrangler-config.sh stg)
      - (cd webapp && npm run lint)
      - (cd webapp && NODE_OPTIONS="--max-old-space-size=4096" npm run test-ci)
    artifact_paths:
      - "webapp/reports/**"
      - "webapp/coverage/**"

  # junit-annotate is its own step on purpose: it reads the XML from the
  # artifacts API, and in the producing step the upload has not happened yet
  # (learned in build #8, where it died with "no artifacts found"). Running it
  # after code_test also means it annotates results whether or not the tests
  # passed.
  - label: ":junit: Test results"
    key: junit_annotate
    agents: *agent-queue
    depends_on:
      - code_test
    allow_dependency_failure: true
    plugins:
      - junit-annotate#v2.7.0:
          artifacts: "webapp/reports/*.xml"
          context: ftn-code-test
          # When code_test never ran (an upstream failure) there is no XML to
          # annotate, and the plugin's default is to exit 2 on a failed download
          # - a second, misleading failure on top of the real one (builds #15,
          # #18). Note this is NOT `fail-build-on-error`, which is about errors
          # parsing the XML. Artifacts still upload when tests fail, so genuine
          # test failures are still annotated.
          failed-download-exit-code: 0
    command: "echo 'annotating test results'"
