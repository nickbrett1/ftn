# Preview deploy — ported from CircleCI's `deploy-preview` job.
#
# This file is uploaded by .buildkite/bootstrap.sh ONLY on a non-main branch
# (and not a dependabot/** branch). CircleCI's job ran on branches that ignore
# main and dependabot/**, which is the same policy, but it lives in the upload
# logic rather than in a step-level `if:` here: Buildkite still creates a job
# object for a step whose `if:` is false, and that job — agentless,
# exit_status null, zero log rows — is reported with the terminal state
# `broken`, making a perfectly green main build look like it has a failed job.
# Not uploading the step at all avoids the phantom.

steps:
  - label: ":rocket: Deploy preview"
    key: deploy_preview
    agents:
      queue: mac-studio-linux
    depends_on:
      - code_test
    plugins:
      - artifacts#v1.9.4:
          download:
            - "webapp/.svelte-kit/**"
            - "webapp/static/pdf.worker.min.mjs"
      - docker#v5.13.0:
          image: "mcr.microsoft.com/playwright:v1.63.0-jammy@sha256:167d0506cfbe3c294fb214b2d11737326eeee028aa611fa1ba538e5057675847"
          workdir: /workdir
          environment:
            - DOPPLER_TOKEN
            - DOPPLER_PROJECT
            - DOPPLER_ENVIRONMENT
    env:
      DOPPLER_PROJECT: webapp
      DOPPLER_ENVIRONMENT: stg
      SENTRY_ORG: nick-brett
      SENTRY_PROJECT: bem-backend
      SENTRY_ENVIRONMENT: preview
    commands:
      - bash .buildkite/scripts/install-doppler-cli.sh
      - CF_DOPPLER_CONFIG=stg . .buildkite/scripts/export-cloudflare-env.sh
      - (cd webapp && ./scripts/setup-wrangler-config.sh stg)
      - apt-get update && apt-get install -y --no-install-recommends jq
      - (cd webapp && npm ci --no-audit --no-fund --prefer-offline)
      - chmod +x ./webapp/scripts/sync-doppler-secrets.sh
      - ./webapp/scripts/sync-doppler-secrets.sh --project webapp --config stg --env preview
      - (cd webapp && npm run deploy-preview)
